version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artha_kosha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artha_kosha"]
      interval: 2s
      timeout: 5s
      retries: 10

  finance-api:
    build:
      context: ../apps/finance-api
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      FINANCE_API_ALLOWED_ORIGINS: "http://localhost:3000"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/artha_kosha?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "npm install && npm run dev"
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/workspace

volumes:
  postgres_data:
