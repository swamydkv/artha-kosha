version: "1"
packages:
  - name: "db"
    path: "github.com/swamydkv/artha-kosha/apps/finance-api/sqlc"
    queries: "./sql"
    schema: "./migrations"
    engine: "postgresql"
    emit_json_tags: true
    emit_prepared_queries: false
version: "2"
sql:
  - schema: "../migrations/"
    queries: "./queries/"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/sqlc/"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false