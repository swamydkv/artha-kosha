version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artha_kosha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  finance-api:
    build:
      context: ../apps/finance-api
    working_dir: /workspace
    command: go run ./cmd
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "npm install && npm run dev"
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/workspace

volumes:
  postgres_data:
