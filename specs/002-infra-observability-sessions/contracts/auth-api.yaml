openapi: 3.0.3
info:
  title: ArthaKosha Authentication API
  version: 1.0.0
paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          headers:
            Set-Cookie:
              description: HttpOnly session cookie
              schema:
                type: string
                example: session_id=uuid; HttpOnly; Path=/; Max-Age=28800; SameSite=Strict
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
            X-Correlation-ID:
              description: Correlation identifier for request tracing
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error
        '409':
          description: Duplicate field conflict

  /login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly session cookie
              schema:
                type: string
                example: session_id=uuid; HttpOnly; Path=/; Max-Age=28800; SameSite=Strict
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
            X-Correlation-ID:
              description: Correlation identifier for request tracing
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /logout:
    post:
      summary: End a user session
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Clear session cookie
              schema:
                type: string
                example: session_id=; HttpOnly; Path=/; Max-Age=0; SameSite=Strict
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
            X-Correlation-ID:
              description: Correlation identifier for request tracing
              schema:
                type: string

  /session:
    get:
      summary: Validate current session
      description: Returns session information if the current session is valid and active
      responses:
        '200':
          description: Session is valid
          headers:
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
            X-Correlation-ID:
              description: Correlation identifier for request tracing
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: No valid session or session expired
        '404':
          description: Session not found

    delete:
      summary: Revoke current session
      description: Revokes the current user session (logout from current device)
      responses:
        '200':
          description: Session revoked successfully
          headers:
            Set-Cookie:
              description: Clear session cookie
              schema:
                type: string
                example: session_id=; HttpOnly; Path=/; Max-Age=0; SameSite=Strict
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
            X-Correlation-ID:
              description: Correlation identifier for request tracing
              schema:
                type: string
        '401':
          description: No valid session

  /sessions:
    delete:
      summary: Revoke all user sessions
      description: Revokes all sessions for the authenticated user (logout from all devices)
      responses:
        '200':
          description: All sessions revoked successfully
          headers:
            Set-Cookie:
              description: Clear session cookie
              schema:
                type: string
                example: session_id=; HttpOnly; Path=/; Max-Age=0; SameSite=Strict
            X-Request-ID:
              description: Request correlation identifier
              schema:
                type: string
            X-Correlation-ID:
              description: Correlation identifier for request tracing
              schema:
                type: string
        '401':
          description: No valid session

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - full_name
        - date_of_birth
        - mobile_number
        - email
        - username
        - password
        - confirm_password
      properties:
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
        mobile_number:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        welcome_message:
          type: string

    SessionResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, expired, revoked]
